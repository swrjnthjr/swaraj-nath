<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Electric Cyan to Indigo Gradient -->
    <linearGradient id="favBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Canvas (High visibility on dark & light browser tabs) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#favBg)" stroke="url(#favBrand)" stroke-width="1.5"/>

  <!-- Stylized Geometric 'S' Path -->
  <!-- Top Loop -->
  <path d="M 44 22 C 38 15 22 16 18 24 C 15 30 22 34 32 35.5" 
        fill="none" 
        stroke="url(#favBrand)" 
        stroke-width="4.5" 
        stroke-linecap="round" />

  <!-- Center Core Pivot -->
  <circle cx="32" cy="32" r="2.5" fill="url(#favGold)" />

  <!-- Bottom Loop -->
  <path d="M 32 28.5 C 42 30 49 34 46 40 C 42 48 26 49 20 42" 
        fill="none" 
        stroke="url(#favBrand)" 
        stroke-width="4.5" 
        stroke-linecap="round" />
</svg>
